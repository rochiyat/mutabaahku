name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mutabaah
          POSTGRES_PASSWORD: mutabaah
          POSTGRES_DB: mutabaahku_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mutabaah -d mutabaahku_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://mutabaah:mutabaah@localhost:5432/mutabaahku_test
      TEST_DATABASE_URL: postgres://mutabaah:mutabaah@localhost:5432/mutabaahku_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      SEED_DEFAULT_PASSWORD: ci-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Backend tests
        run: npm run test:be
      - name: Frontend tests
        run: npm run test:fe
      - name: Frontend build
        run: npm run build:fe

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t mutabaahku:ci .
